name: Android APK / ساخت اندروید
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install and verify / نصب و بررسی
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npx expo prebuild --platform android --no-install
          node tests/setup-acceptance.cjs
      - name: Build release / ساخت نسخه انتشار
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :acceptance:assembleDebug :acceptance:assembleDebugAndroidTest --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Sign APK / امضای بسته
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias fityar --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out fityar.apk "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose fityar.apk
          rm "$RUNNER_TEMP/release.p12"
          sha256sum fityar.apk > fityar.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fityar-apk
          path: |
            fityar.apk
            fityar.apk.sha256
            android/acceptance/build/outputs/apk/debug/acceptance-debug.apk
            android/acceptance/build/outputs/apk/androidTest/debug/acceptance-debug-androidTest.apk
      - name: Enable emulator acceleration / فعال‌سازی شبیه‌ساز
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare audio capture / آماده‌سازی ضبط صدا
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y pulseaudio ffmpeg libasound2-plugins xvfb
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/fityar-xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=fityar_test
          pactl set-default-sink fityar_test
          echo 'QEMU_AUDIO_DRV=pa' >> "$GITHUB_ENV"
          echo 'FITYAR_AUDIO_TEST=1' >> "$GITHUB_ENV"
      - name: Emulator smoke / آزمون شبیه‌ساز
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: python tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/
      - name: Publish preview / انتشار پیش‌نمایش
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0-preview.${GITHUB_RUN_NUMBER}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'FitYar preview / پیش‌نمایش فیت‌یار' --notes-file RELEASE.md
          gh release upload "$TAG" fityar.apk fityar.apk.sha256 --clobber

